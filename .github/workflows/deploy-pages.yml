name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Unit tests, build, and production smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and production build checks
        run: npm run check
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Run production bundle smoke check
        run: npm run test:production-smoke
      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-production
          path: test-results
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  smoke:
    name: Browser smoke (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The perf-bench file is one serial group that takes minutes, so it gets its own job.
        shard: [1, 2, 3, 4, 5, perf-bench]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Run browser smoke checks
        if: matrix.shard != 'perf-bench'
        run: npm run test:smoke -- --shard=${{ matrix.shard }}/5
        env:
          SMOKE_SKIP_PERF_BENCH: '1'
      - name: Run perf-bench smoke checks
        if: matrix.shard == 'perf-bench'
        run: npm run test:smoke -- tests/perf-bench.smoke.ts
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-shard-${{ matrix.shard }}
          path: test-results
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs finish in any order, and the group only serialises deploys. A run for an older commit
      # can pass its tests after a newer run, so skip it unless it is still the head of main. The
      # check runs inside the group, so it sees the head at the moment this deploy would start.
      - name: Check this commit is the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy of ${{ github.sha }}: main is now at $head."
          fi
      - name: Deploy to GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
